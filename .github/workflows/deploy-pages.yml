# 自动把前端部署到 GitHub Pages
#
# 触发条件：推送到 main 分支，或在 Actions 页面手动触发。
# 部署内容：仓库里的 src/ 目录（纯静态文件，无需构建）。
#
# 首次运行时会通过 configure-pages 的 enablement 参数自动开启 Pages，
# 不需要手动去 Settings 里设置。

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流向 GitHub Pages 发布，并获取 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新的推送会取消进行中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages（首次会自动开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态文件（src 目录）
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
